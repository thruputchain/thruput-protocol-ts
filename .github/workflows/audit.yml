name: Security Audit

on:
  schedule:
    - cron: "0 8 * * *" # daily at 8am UTC
  workflow_dispatch: # allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --omit=dev

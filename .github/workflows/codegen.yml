name: Codegen

# Regenerate the bindings and fail if the result differs from what is
# committed, so a hand edit to generated code cannot ship. x23c comes from a
# private hogd release and the protocol submodule needs a deploy key, so this
# runs on the internal runner and is skipped for pull requests from forks.
# CI's credential-free `codegen:check` still covers the protocol commit there.

on:
  push:
    branches: [main, auto-update/protocol]
    paths:
      - protocol
      - "packages/*/package.json"
      - "packages/*/src/protocol/**"
      - "packages/protocol/test/fixtures/test_*"
      - "packages/rpc/test/fixtures/echo.*"
      - scripts/generate.sh
      - .github/workflows/codegen.yml
  pull_request:
    paths:
      - protocol
      - "packages/*/package.json"
      - "packages/*/src/protocol/**"
      - "packages/protocol/test/fixtures/test_*"
      - "packages/rpc/test/fixtures/echo.*"
      - scripts/generate.sh
      - .github/workflows/codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-hogd-linux
    steps:
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: groundhogchain
          repositories: hogd

      # Check out before loading the deploy key: ssh-agent maps
      # https://github.com/groundhogchain/protocol* to that key, and the
      # prefix also matches protocol-ts, which the key cannot read.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROTOCOL_DEPLOY_SECRET_KEY }}

      - name: Fetch protocol submodule
        run: git submodule update --init --depth 1 protocol

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo groundhogchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz' \
            --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/x23c-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/x23c"
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}

      - name: Regenerate
        run: XDRC="$RUNNER_TEMP/x23c" ./scripts/generate.sh

      # A difference is either a hand edit to generated output or an x23c
      # release newer than the one these files were generated with (see the
      # x23c commit on line 2 of each file); either way, regenerate and commit.
      - name: Check generated code is fresh
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is stale or hand-edited. Run XDRC=/path/to/x23c ./scripts/generate.sh and commit the result."
            exit 1
          fi

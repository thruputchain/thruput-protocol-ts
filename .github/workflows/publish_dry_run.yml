name: Release dry run checks

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://npm.pkg.github.com"

      - run: npm ci

      - name: Validate versions match
        run: |
          set -euo pipefail

          VERSIONS=$(jq -r '.version' packages/*/package.json | sort -u)
          COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Not all packages have the same version!"
            for pkg in packages/*/package.json; do
              echo "  $(jq -r '.name' "$pkg"): $(jq -r '.version' "$pkg")"
            done
            exit 1
          fi

          echo "All packages at version $VERSIONS"

      - name: Validate internal dependency pins
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' packages/*/package.json | sort -u)
          FAIL=0
          for pkg in packages/*/package.json; do
            BAD=$(jq -r --arg v "$VERSION" \
              '.dependencies // {} | to_entries[]
               | select(.key | startswith("@thruputchain/"))
               | select(.value != $v)
               | "\(.key) pinned to \(.value)"' "$pkg")
            if [ -n "$BAD" ]; then
              echo "ERROR: $(jq -r '.name' "$pkg") has internal deps not pinned to $VERSION:"
              echo "$BAD" | sed 's/^/  /'
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "All internal @thruputchain/* dependencies pinned to $VERSION"

      # Mirror publish.yml's gate so the dry run exercises the same checks.
      - name: Typecheck
        run: npm run typecheck

      - name: Docs
        run: npm run docs:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Packed consumer checks
        run: npm run test:package

      - name: Publish dry run
        run: npm publish --workspaces --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

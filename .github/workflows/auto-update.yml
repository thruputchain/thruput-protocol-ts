name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qualification-private-app-updater-5292764
  cancel-in-progress: true

jobs:
  update:
    runs-on: namespace-profile-hogd-linux
    steps:
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: groundhogchain
          repositories: hogd

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_DEPLOY_SECRET_KEY }}
            ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}

      - name: Route pushes through the repository write key
        run: |
          # The retained write key still has the repository's pre-transfer comment.
          SELF_KEY_URL=$(git config --global --get-regexp '^url\..*\.insteadof$' |
            awk '$2 == "git@github.com:groundhogchain/protocol-ts" {
              sub(/^url\./, "", $1); sub(/\.insteadof$/, "", $1); print $1; exit
            }')
          test -n "$SELF_KEY_URL"
          git config --global \
            url."${SELF_KEY_URL%:*}:thruputchain/thruput-protocol-ts".insteadOf \
            git@github.com:thruputchain/thruput-protocol-ts

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
          # SSH agent mappings handle private submodules and the later push.
          persist-credentials: false

      - name: Update protocol submodule to latest main
        run: |
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Setup Node for import normalization
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo groundhogchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz'
          tar xzf x23c-linux-x86_64.tar.gz
          chmod +x x23c
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}

      - name: Regenerate
        run: XDRC=./x23c ./scripts/generate.sh

      - name: Check for changes
        id: diff
        run: |
          rm -f x23c x23c-linux-x86_64.tar.gz
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short=7 HEAD)
          BRANCH="qualification/private-app-updater-5292764-generated"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:thruputchain/thruput-protocol-ts.git

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump to protocol@${PROTOCOL_SHA}"
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --draft \
              --base "qualification/private-app-updater-5292764-base" \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: groundhogchain/protocol@${PROTOCOL_SHA}"
          fi

          echo "Qualification PR remains a draft; auto-merge is disabled."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

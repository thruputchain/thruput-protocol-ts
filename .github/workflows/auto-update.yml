name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-protocol
  cancel-in-progress: true

jobs:
  update:
    runs-on: namespace-profile-hogd-linux
    steps:
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: groundhogchain
          repositories: hogd

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_DEPLOY_SECRET_KEY }}
            ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}

      # .gitmodules uses the HTTPS URL; this runner fetches the
      # submodule with the deploy key above instead.
      - name: Fetch protocol submodule over SSH
        run: git config --global url."git@github.com:groundhogchain/protocol.git".insteadOf https://github.com/groundhogchain/protocol.git

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}

      # generate.sh records the protocol commit in package.json with node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Update protocol submodule to latest main
        run: |
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo groundhogchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz'
          tar xzf x23c-linux-x86_64.tar.gz
          chmod +x x23c
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}

      - name: Regenerate
        run: XDRC=./x23c ./scripts/generate.sh

      - name: Check for changes
        id: diff
        run: |
          rm -f x23c x23c-linux-x86_64.tar.gz
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short=7 HEAD)
          BRANCH="auto-update/protocol"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:groundhogchain/protocol-ts.git

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump to protocol@${PROTOCOL_SHA}"
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: groundhogchain/protocol@${PROTOCOL_SHA}" || true
          fi

          gh pr merge "$BRANCH" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

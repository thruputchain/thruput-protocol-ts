name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-protocol
  cancel-in-progress: true

jobs:
  update:
    runs-on: namespace-profile-hogd-linux
    steps:
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: groundhogchain
          repositories: hogd

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_DEPLOY_SECRET_KEY }}
            ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}

      - name: Update protocol submodule to latest main
        run: |
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo groundhogchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz'
          tar xzf x23c-linux-x86_64.tar.gz
          chmod +x x23c
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}

      - name: Regenerate
        run: XDRC=./x23c ./scripts/generate.sh

      - name: Check for changes
        id: diff
        run: |
          rm -f x23c x23c-linux-x86_64.tar.gz
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short=7 HEAD)
          BRANCH="auto-update/protocol"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:groundhogchain/protocol-ts.git

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump to protocol@${PROTOCOL_SHA}"
          git push -f -u origin "$BRANCH"

          echo "::group::Debug: gh auth status"
          gh auth status 2>&1 || true
          echo "::endgroup::"

          echo "::group::Debug: gh pr list"
          gh pr list --head "$BRANCH" --state open --json url 2>&1; LIST_RC=$?
          echo "gh pr list exit code: $LIST_RC"
          echo "::endgroup::"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url' 2>&1)
          echo "EXISTING_PR='$EXISTING_PR'"

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
            gh pr merge "$EXISTING_PR" --auto --squash 2>&1; echo "merge exit code: $?"
          else
            echo "::group::Debug: gh pr create"
            set +e
            PR_URL=$(gh pr create \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: groundhogchain/protocol@${PROTOCOL_SHA}" 2>&1)
            CREATE_RC=$?
            set -e
            echo "gh pr create exit code: $CREATE_RC"
            echo "PR_URL='$PR_URL'"
            echo "::endgroup::"
            if [ $CREATE_RC -eq 0 ]; then
              gh pr merge "$PR_URL" --auto --squash 2>&1; echo "merge exit code: $?"
            else
              echo "::error::gh pr create failed (rc=$CREATE_RC): $PR_URL"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qualify-private-protocol-ts
  cancel-in-progress: true

jobs:
  update:
    runs-on: namespace-profile-hogd-linux
    steps:
      - name: Generate protocol inputs read token
        id: inputs-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: hogd,thruput-protocol
          permission-contents: read

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ssh-key: ${{ secrets.PROT_TS_TO_SELF_WRITE_KEY }}
          fetch-depth: 2 # Include the reviewed parent for workflow restoration.

      - name: Update protocol submodule to latest main
        env:
          GH_TOKEN: ${{ steps.inputs-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/thruputchain/thruput-protocol.git".insteadOf \
            "https://github.com/thruputchain/thruput-protocol.git"
          git submodule update --init protocol
          git -C protocol fetch origin b586e8844b4ae981cb68567c59e5d10514420fba
          git -C protocol checkout b586e8844b4ae981cb68567c59e5d10514420fba

      - name: Setup Node for import normalization
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo thruputchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz'
          tar xzf x23c-linux-x86_64.tar.gz
          chmod +x x23c
        env:
          GH_TOKEN: ${{ steps.inputs-token.outputs.token }}

      - name: Regenerate
        run: XDRC=./x23c ./scripts/generate.sh

      - name: Check for changes
        id: diff
        run: |
          rm -f x23c x23c-linux-x86_64.tar.gz
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short=7 HEAD)
          BRANCH="qualification/private-protocol-source"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:thruputchain/thruput-protocol-ts.git

          git checkout -b "$BRANCH"
          git show 439c0917b006972628715712bfcf034404657438:.github/workflows/auto-update.yml > .github/workflows/auto-update.yml
          git add -A
          git commit -m "bump to protocol@${PROTOCOL_SHA}"
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --draft --base repair-private-protocol-routing \
              --title "Qualify private TypeScript protocol updater at ${PROTOCOL_SHA}" \
              --body "Isolated private-source and Hogd release read, regeneration, retained write-key push and draft PR qualification. Source code is unchanged from main; this pins the reviewed notification repair commit to exercise PR creation. Production workflow restored in generated branch. Do not merge.

          Protocol: thruputchain/thruput-protocol@${PROTOCOL_SHA}"
          fi

          # Qualification PR stays draft; no automatic merge.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release packages

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://npm.pkg.github.com"

      - run: npm ci

      - name: Validate versions match
        run: |
          set -euo pipefail

          VERSIONS=$(jq -r '.version' packages/*/package.json | sort -u)
          COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Not all packages have the same version!"
            for pkg in packages/*/package.json; do
              echo "  $(jq -r '.name' "$pkg"): $(jq -r '.version' "$pkg")"
            done
            exit 1
          fi

          VERSION="$VERSIONS"
          echo "All packages at version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Tag commit with version
        id: tag
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists!"
            exit 1
          fi

          git tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}.git

          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            LOCAL_COMMIT=$(git rev-parse "$TAG")
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote at same commit. Skipping push."
            else
              echo "ERROR: Tag $TAG exists on remote but points to different commit!"
              exit 1
            fi
          else
            git push origin "$TAG"
          fi

      - name: Publish packages
        run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and preview publication without publishing or tagging
        type: boolean
        default: true

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://npm.pkg.github.com"

      - run: npm ci

      - name: Validate versions match
        run: |
          set -euo pipefail

          VERSIONS=$(jq -r '.version' packages/*/package.json | sort -u)
          COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Not all packages have the same version!"
            for pkg in packages/*/package.json; do
              echo "  $(jq -r '.name' "$pkg"): $(jq -r '.version' "$pkg")"
            done
            exit 1
          fi

          VERSION="$VERSIONS"
          echo "All packages at version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate internal dependency pins
        run: |
          set -euo pipefail

          FAIL=0
          for pkg in packages/*/package.json; do
            BAD=$(jq -r --arg v "$VERSION" \
              '.dependencies // {} | to_entries[]
               | select(.key | startswith("@thruputchain/"))
               | select(.value != $v)
               | "\(.key) pinned to \(.value)"' "$pkg")
            if [ -n "$BAD" ]; then
              echo "ERROR: $(jq -r '.name' "$pkg") has internal deps not pinned to $VERSION:"
              echo "$BAD" | sed 's/^/  /'
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "All internal @thruputchain/* dependencies pinned to $VERSION"

      # Same gate as CI's `check` and `test` jobs — a release is dispatched
      # manually and can run on a commit CI never covered, so it re-verifies
      # rather than trusting a green tick upstream.
      - name: Typecheck
        run: npm run typecheck

      - name: Docs
        run: npm run docs:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Packed consumer checks
        run: npm run test:package

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@thruputchain"

      - name: Publish packages to npm
        run: bash scripts/publish-npm.sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: CI

on:
  push:
    branches: [main, auto-update/protocol]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  cross-sdk:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: "sparse+https://groundhog.dev/crates/api/v1/crates/"
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable

      - run: npm ci

      - name: Install groundhog-test-vectors
        run: cargo install groundhog-test-vectors --registry groundhog

      - name: Generate entrypoint vectors
        run: groundhog-test-vectors entrypoint-id > packages/protocol/test/fixtures/entrypoint_vectors.json

      - name: Generate XDR vectors
        run: groundhog-test-vectors xdr > packages/protocol/test/fixtures/xdr_vectors.json

      - name: Run cross-SDK tests
        run: cd packages/protocol && npx vitest run test/cross-sdk/
